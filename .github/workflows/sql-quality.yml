name: SQL quality

on:
  push:
    branches:
      - main
      - phase-3-performance-engineering
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install SQLFluff
        run: python -m pip install --disable-pip-version-check sqlfluff==4.3.0
      - name: Lint portfolio SQL
        run: >-
          sqlfluff lint
          Project_sql
          analytics
          performance/01_drop_candidate_indexes.sql
          performance/02_candidate_indexes.sql
          sql_load/2_create_tables.sql
          --dialect postgres

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sql_course
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sql_course"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: sql_course
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Create schema
        run: psql -X -v ON_ERROR_STOP=1 -f sql_load/2_create_tables.sql
      - name: Load deterministic fixture
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/seed.sql
      - name: Build analytics views
        run: psql -X -v ON_ERROR_STOP=1 -f analytics/00_models.sql
      - name: Validate data contracts
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/data_contracts.sql
      - name: Validate analytics contracts
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/analytics_contracts.sql
      - name: Verify foundational query outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p actual
          for sql in Project_sql/*.sql; do
            name="$(basename "$sql" .sql)"
            psql -X -v ON_ERROR_STOP=1 -At -F '|' -f "$sql" > "actual/${name}.txt"
            diff -u "tests/expected/${name}.txt" "actual/${name}.txt"
          done
      - name: Verify original analytics outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p actual/analytics
          for sql in analytics/questions/*.sql; do
            name="$(basename "$sql" .sql)"
            psql -X -v ON_ERROR_STOP=1 -At -F '|' -f "$sql" > "actual/analytics/${name}.txt"
            diff -u "tests/expected/analytics/${name}.txt" "actual/analytics/${name}.txt"
          done
