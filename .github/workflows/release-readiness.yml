name: Release readiness

on:
  push:
    branches:
      - main
      - phase-4-portfolio-release
  pull_request:

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate v1.0.0 release package
        shell: bash
        run: |
          set -euo pipefail

          test "$(tr -d '\r\n' < VERSION)" = "1.0.0"

          required_files=(
            CHANGELOG.md
            THIRD_PARTY_NOTICES.md
            docs/ERD.md
            docs/DATA_DICTIONARY.md
            docs/ANALYTICS_METHODS.md
            docs/PORTFOLIO_FINDINGS.md
            docs/RELEASE_NOTES_v1.0.0.md
            performance/BENCHMARK_RESULTS.md
          )

          for file in "${required_files[@]}"; do
            test -s "$file"
          done

          grep -Fq "## [1.0.0]" CHANGELOG.md
          grep -Fq 'Release target:** `v1.0.0`' README.md
          grep -Fq 'erDiagram' docs/ERD.md
          grep -Fq 'analytics.data_analyst_postings' docs/DATA_DICTIONARY.md
          grep -Fq 'analytics.data_analyst_skills' docs/DATA_DICTIONARY.md

          if git ls-files 'csv_files/*' | grep -q .; then
            echo "Raw course CSV files must not be tracked in the release."
            exit 1
          fi

          git diff --check origin/main...HEAD
