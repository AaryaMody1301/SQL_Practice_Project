changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
        - Semver-Major
    - title: Enhancements
      labels:
        - enhancement
        - Semver-Minor
    - title: Fixes
      labels:
        - bug
        - Semver-Patch
    - title: Documentation and other changes
      labels:
        - "*"
